name: Feature request
description: Suggest an improvement to Studio
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or workflow gap should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you want, not just the implementation.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Prompts, screenshots, templates, or examples that help explain the request.
